<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produse - KFC România</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/sco/b/bf/KFC_logo.svg"> 
</head>

<!-- POPUP PRODUSE -->
<div id="popup" class="popup">
  <div class="popup-content">
    <span class="close">&times;</span>
    <h2 id="popup-title"></h2>
    <img id="popup-img" src="" alt="Produs" />
    <p id="popup-desc"></p>
    <p id="popup-price"></p>
  </div>
</div>

<body>

<header>
    <div class="logo">
      <img src="https://blog.logomyway.com/wp-content/uploads/2020/09/KFC-logo.jpg" height="70" alt="KFC Logo">
    </div>

    <nav>
      <ul>
        <li><a href="index.php">Acasă</a></li>
        <li><a href="produse.html" class="active">Produse</a></li>
        <li><a href="oferte.php">Oferte</a></li>
        <li><a href="restaurante.php">Restaurante</a></li>
        <li><a href="kfcinromania.php">KFC România</a></li>
        <li><a href="istorie-kfc.php">Istorie KFC</a></li>
        <li><a href="comanda.php">Comandă Acum</a></li>
        <li><a href="login.php">Login</a></li>
      </ul>
    </nav>
</header>

<section class="produse">
  <h2>Toate Produsele</h2>
  <div class="produse-grid" id="produseContainer"></div>
</section>

<!-- BUTON BACK TO TOP -->
<button id="backToTop" title="Înapoi sus">
  <span class="arrow-up"></span>
</button>

<footer>
  <div class="footer-content">
    <p>&copy; 2025 KFC România - Pagina demonstrativă</p>
    <p>Urmărește-ne pe 
      <a href="https://www.facebook.com/KFC.Romania/">Facebook</a> |
      <a href="https://www.instagram.com/kfc/?hl=en">Instagram</a> |
      <a href="https://www.youtube.com/user/kfcro">YouTube</a>
    </p>
  </div>
</footer>

<script>
  /* =====================================================
     ÎNCĂRCARE PRODUSE DIN BAZA DE DATE (get_produse.php)
  =======================================================*/
  
  let produseInfo = {};

  fetch("get_produse.php")
    .then(res => res.json())
    .then(data => {
      const container = document.getElementById("produseContainer");
      container.innerHTML = "";

      data.forEach(prod => {
        // Salvăm detalii pentru popup
        produseInfo[prod.nume_produs] = {
          descriere: prod.descriere,
          pret: prod.pret + " lei",
          imagine: prod.imagine ?? "default.jpg"
        };

        // Afișăm produsul pe pagină
        container.innerHTML += `
          <div class="produs">
            <img src="${prod.imagine ?? 'default.jpg'}" alt="${prod.nume_produs}">
            <h3>${prod.nume_produs}</h3>
            <p>Preț: ${prod.pret} lei</p>
            <a href="#" class="btn-small" data-nume="${prod.nume_produs}">Detalii</a>
          </div>
        `;
      });

      // Re-atașăm evenimentele pentru butoanele Detalii
      document.querySelectorAll(".btn-small").forEach(btn => {
        btn.addEventListener("click", e => {
          e.preventDefault();
          deschidePopup(btn.dataset.nume);
        });
      });
    });

  /* =====================================================
      POPUP PRODUSE
  =======================================================*/
  const popup = document.getElementById("popup");
  const popupTitle = document.getElementById("popup-title");
  const popupDesc = document.getElementById("popup-desc");
  const popupPrice = document.getElementById("popup-price");
  const popupImg = document.getElementById("popup-img");
  const closeBtn = document.querySelector(".close");

  function deschidePopup(numeProdus) {
    const p = produseInfo[numeProdus];
    popupTitle.textContent = numeProdus;
    popupDesc.textContent = p.descriere;
    popupPrice.textContent = "Preț: " + p.pret;
    popupImg.src = p.imagine;

    popup.style.display = "flex";
  }

  closeBtn.onclick = () => popup.style.display = "none";
  window.onclick = (e) => { if (e.target === popup) popup.style.display = "none"; };

  /* =====================================================
     BUTON ÎNAPOI SUS
  =======================================================*/
  const backToTop = document.getElementById("backToTop");
  window.onscroll = function () {
    if (window.scrollY > 200) backToTop.style.display = "flex";
    else backToTop.style.display = "none";
  };

  backToTop.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
</script>

</body>
</html>
