version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_kfc
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: Ionita_Alexandru_Bogdan
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql

  php:
    image: php:8.2-apache
    container_name: php_kfc
    ports:
      - "8080:80"
    volumes:
      - ./site:/var/www/html
    depends_on:
      - mysql
