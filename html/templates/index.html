<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Estimare durata de viata scula CNC</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 600px; margin: auto; }
        form { margin-bottom: 20px; }
        label { display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { margin-top: 15px; padding: 10px 20px; font-size: 16px; }
        .rezultat { margin-top: 20px; padding: 15px; border: 1px solid #333; background: #f0f0f0; }
        h1 { text-align: center; }
        .error { background:#ffd6d6; border:1px solid #ff4d4d; padding:10px; margin-top:10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Estimare durata de viata scula CNC</h1>

        <form method="POST">
            <label>Scula:
                <select name="scula" required>
                    {% for scula in scule %}
                    <option value="{{ loop.index0 }}">{{ scula[0] }} - {{ scula[1] }}</option>
                    {% endfor %}
                </select>
            </label>

            <label>Material prelucrat:
                <select name="material" required>
                    <option value="Otel">Otel</option>
                    <option value="Aluminiu">Aluminiu</option>
                    <option value="Inox">Inox</option>
                </select>
            </label>

            <label>Turatia curenta (RPM):
                <input type="number" name="turatie" step="any" required>
            </label>

            <label>Avansul curent (mm/min):
                <input type="number" name="avans" step="any" required>
            </label>

            <label>Adancimea de aschiere (mm):
                <input type="number" name="adancime" step="any" required>
            </label>

            <label>Debit lichid racire (L/min):
                <input type="number" name="debit" step="any" required>
            </label>

            <label>Temperatura (C):
                <input type="number" name="temperatura" step="any" required>
            </label>

            <label>Vibratii (mm/s):
                <input type="number" name="vibratii" step="any" required>
            </label>

            <label>Zgomot (dB):
                <input type="number" name="zgomot" step="any" required>
            </label>

            <button type="submit">Calculeaza</button>
        </form>

        {% if rezultat and rezultat.error %}
        <div class="error">
            <strong>Eroare:</strong> {{ rezultat.error }}
        </div>
        {% endif %}

        {% if rezultat and not rezultat.error %}
        <div class="rezultat">
            <h3>Rezultat estimare:</h3>
            <p><strong>Scula:</strong> {{ rezultat.tip_scula }} - {{ rezultat.model_scula }}</p>
            <p><strong>Uzura estimata:</strong> {{ rezultat.uzura_pred }}%</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
